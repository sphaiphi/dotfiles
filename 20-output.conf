# ~/.config/sway/config.d/20-output.conf
#
# Output (display) configuration. The wildcard block applies to every
# connected output so this works unmodified on a fresh machine; add a
# named block below only once you need per-monitor overrides
# (resolution, position, scale, refresh rate).
#
# Run `swaymsg -t get_outputs` to see identifiers for the example below.
#
# Requires: swaybg (wallpaper)

### Default: sane background for every output, no scaling surprises
output * bg #1e1e2e solid_color

### Per-monitor override example — uncomment and edit to use.
# Prefer an explicit mode/position over "highest available" so
# reconnecting a dock/monitor doesn't silently change your resolution.
#output "Dell Inc. DELL U2718Q 1ABC123" {
#    resolution 3840x2160
#    position 0,0
#    scale 1.5
#}
#output "eDP-1" {
#    resolution 1920x1080
#    position 3840,0
#}

### Laptop lid handling (safe no-op on desktops without an internal panel)
bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable
