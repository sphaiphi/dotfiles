# ~/.config/foot/foot.ini
#
# Active theme is selected by the include below. To switch: point it
# at a different themes/<name>.ini file and restart foot (no reload
# mechanism like sway's $mod+Shift+c — just close and reopen, or run
# `footclient` fresh if using server mode).
#
# NOTE ON FOOT VERSIONS: as of this writing, Fedora 43 and Ubuntu
# 26.04 LTS both ship foot 1.25.0, which uses the [colors] section —
# that's what themes/*.ini use below. foot 1.26.0 deprecated [colors]
# in favor of [colors-dark]/[colors-light] (supporting automatic
# light/dark switching), and foot 1.28.0 removed [colors] entirely. If
# you upgrade foot past 1.26 later, rename [colors] to [colors-dark]
# in both theme files below — using the new name on 1.25.0 would
# silently fail to apply instead, since that section didn't exist yet.
[main]
include=themes/nord.ini
