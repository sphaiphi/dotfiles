# ~/.config/foot/themes/catppuccin.ini
#
# Catppuccin Mocha, official 16-color ANSI terminal mapping
# (cross-checked against catppuccin/windows-terminal and
# catppuccin/kitty's official ports — both agree). Note bright-red
# through bright-magenta reuse the same hex as their regular
# counterparts; that's correct, not a copy-paste mistake — it's how
# Catppuccin's own ports are specified.
#
# foot.ini(5): colors are RRGGBB, no leading #. See foot.ini's own
# comment for why this is [colors] and not [colors-dark].
[colors]
background=1E1E2E
foreground=CDD6F4

regular0=45475A
regular1=F38BA8
regular2=A6E3A1
regular3=F9E2AF
regular4=89B4FA
regular5=F5C2E7
regular6=94E2D5
regular7=BAC2DE

bright0=585B70
bright1=F38BA8
bright2=A6E3A1
bright3=F9E2AF
bright4=89B4FA
bright5=F5C2E7
bright6=94E2D5
bright7=A6ADC8

selection-foreground=CDD6F4
selection-background=585B70
