# ~/.config/foot/themes/nord.ini
#
# Nord, official 16-color ANSI terminal mapping (nordtheme/terminal-app
# spec — the same mapping Nord's official ports use for every terminal
# emulator, not something invented for this config). Nicely, this is
# also where nord5 and nord7 — called out as "reserved, no distinct
# job at WM scale" in ../../themes/nord.conf — actually get used: a
# terminal's 16-slot ANSI palette has room they don't.
#
# foot.ini(5): colors are RRGGBB, no leading #. See foot.ini's own
# comment for why this is [colors] and not [colors-dark].
[colors]
background=2E3440
foreground=D8DEE9

regular0=3B4252
regular1=BF616A
regular2=A3BE8C
regular3=EBCB8B
regular4=81A1C1
regular5=B48EAD
regular6=88C0D0
regular7=E5E9F0

bright0=4C566A
bright1=BF616A
bright2=A3BE8C
bright3=EBCB8B
bright4=81A1C1
bright5=B48EAD
bright6=8FBCBB
bright7=ECEFF4

selection-foreground=D8DEE9
selection-background=4C566A
