# ~/.config/sway/config.d/40-bindings-core.conf
#
# Core keybindings: launching, focus/move, workspaces, layout, media
# keys. i3-compatible defaults throughout — if you know i3, you already
# know most of this file.
#
# Requires: brightnessctl, wireplumber (wpctl — talks to PipeWire
#           directly, no pipewire-pulse compat layer needed),
#           grim + slurp (screenshot bind lives in 50-modes.conf),
#           playerctl (media keys — invoked on demand, not as a daemon)

### Basics
bindsym $mod+Return exec $term
bindsym $mod+d       exec $menu
bindsym $mod+Shift+q kill
bindsym $mod+Shift+c reload
bindsym $mod+e       exec $file_manager

# Exit sway (with confirmation via swaynag, no extra dependency)
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit sway?' \
    -b 'Yes, exit' 'swaymsg exit'

# Lock screen
bindsym $mod+Escape exec $lock

### Focus
bindsym $mod+$left  focus left
bindsym $mod+$down  focus down
bindsym $mod+$up    focus up
bindsym $mod+$right focus right

### Move focused window
bindsym $mod+Shift+$left  move left
bindsym $mod+Shift+$down  move down
bindsym $mod+Shift+$up    move up
bindsym $mod+Shift+$right move right

### Workspaces
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

bindsym $mod+Tab      workspace back_and_forth
bindsym $mod+Ctrl+$left  workspace prev
bindsym $mod+Ctrl+$right workspace next

### Layout
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+n layout toggle split
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent

### Scratchpad
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus       scratchpad show

### Resize / screenshot entry points (bodies defined in 50-modes.conf)
bindsym $mod+r mode "resize"
bindsym Print  mode "screenshot"

### Media & brightness keys
# Hardware keys, so these work whether or not a bar is running.
#
# Volume/mic: try wpctl (native PipeWire) first, fall back to pactl
# (PulseAudio, or PipeWire's pulse-compat shim) if wpctl isn't
# present or isn't the active session manager. This matters for
# Ubuntu specifically: 22.04 LTS still defaults to PulseAudio for
# actual audio (PipeWire there only handles video/screen-share) —
# the audio-stack switch happened in 22.10+, and by 26.04 LTS
# PipeWire is the sole audio server (no PulseAudio at all). Fedora
# and Ubuntu 22.10+ take the wpctl branch; only 22.04 LTS falls
# through to pactl. -l 1 on wpctl caps volume at 100%; pactl has no
# equivalent flag, so it's capped via +5% steps from a sane baseline
# instead.
bindsym XF86AudioRaiseVolume  exec sh -c \
    'command -v wpctl >/dev/null && wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ \
     || pactl set-sink-volume @DEFAULT_SINK@ +5%'
bindsym XF86AudioLowerVolume  exec sh -c \
    'command -v wpctl >/dev/null && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- \
     || pactl set-sink-volume @DEFAULT_SINK@ -5%'
bindsym XF86AudioMute         exec sh -c \
    'command -v wpctl >/dev/null && wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle \
     || pactl set-sink-mute @DEFAULT_SINK@ toggle'
bindsym XF86AudioMicMute      exec sh -c \
    'command -v wpctl >/dev/null && wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle \
     || pactl set-source-mute @DEFAULT_SOURCE@ toggle'
bindsym XF86MonBrightnessUp   exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym XF86AudioPlay         exec playerctl play-pause
bindsym XF86AudioNext         exec playerctl next
bindsym XF86AudioPrev         exec playerctl previous
