# ~/.config/sway/config.d/00-variables.conf
#
# Central variable definitions. Nothing here has a runtime cost — it's
# all substituted at config-parse time. Change a value once here
# instead of hunting through every later file.
#
# Requires: foot (terminal), wofi (launcher), swaylock (screen lock)

### Mod key
# Logo/Super key. Use Mod1 for Alt if you prefer.
set $mod Mod4

### Core applications
set $term foot
set $menu wofi --show drun --allow-images
set $lock swaylock -f -c 1e1e2e
set $file_manager foot -e ranger

### Directional keys (kept as variables for easy vim <-> arrow swap)
set $left  Left
set $down  Down
set $up    Up
set $right Right

### Workspace names (plain numbers by default — no icon font dependency)
set $ws1  "1"
set $ws2  "2"
set $ws3  "3"
set $ws4  "4"
set $ws5  "5"
set $ws6  "6"
set $ws7  "7"
set $ws8  "8"
set $ws9  "9"
set $ws10 "10"

### Color palette (Catppuccin Mocha-ish, dark, low-contrast borders)
# Used by 10-appearance.conf's window-color block and by mode/bar styling.
set $bg      #1e1e2e
set $fg      #cdd6f4
set $focus   #89b4fa
set $urgent  #f38ba8
set $inactive #45475a
set $text_on_focus #1e1e2e
