# Install this file at: ~/.config/environment.d/10-sway.conf
# (the directory name and .conf extension are required by systemd —
# this is NOT included from ~/.config/sway/config, and never was
# meant to be; that was a mistake in an earlier version of this setup
# that produced "Unknown/invalid command" errors on every line).
#
# How it works: systemd's pam_systemd reads every ~/.config/environment.d/*.conf
# file at LOGIN time (before the display manager execs sway.desktop)
# and exports each KEY=VALUE line into the session's process
# environment. This is a real systemd feature, works the same way
# whether you log in via GDM/SDDM/greetd or a plain TTY, and needs no
# wrapper script or sway config involvement at all.
#
# IMPORTANT: changes here only take effect on your NEXT LOGIN — a
# sway config reload ($mod+Shift+c) does nothing for this file, since
# it's read once, before sway ever starts. Log out and back in (or
# reboot) after editing this.
#
# Format: plain KEY=VALUE per line, no quoting, no shell logic.
# Read `man 5 environment.d` for the full reference.

# --- Wayland / session identity ---
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=sway

# --- Toolkit backends: force Wayland-native rendering ---
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland
_JAVA_AWT_WM_NONREPARENTING=1

# --- Cursor theme (adjust to whatever theme you actually have installed) ---
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24

# --- GTK: keep decorations off since Sway draws its own borders ---
GTK_THEME=Adwaita:dark

# --- Silence GTK's AT-SPI accessibility-bus warning ---
# Without a full desktop environment running an accessibility bus
# launcher, GTK apps print "the name org.a11y.Bus was not provided by
# any .service file" on every start. Harmless, just noisy. This tells
# GTK not to bother connecting at all. Remove this line (and install
# at-spi2-core) if you ever need a screen reader or other assistive
# tech to work.
NO_AT_BRIDGE=1

# --- NVIDIA users only: uncomment if you hit rendering issues ---
#WLR_NO_HARDWARE_CURSORS=1
#WLR_DRM_NO_ATOMIC=1
