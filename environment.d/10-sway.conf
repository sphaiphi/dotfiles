# Install this file at: ~/.config/environment.d/10-sway.conf
# (the directory name and .conf extension are required by systemd —
# this is NOT included from ~/.config/sway/config: plain KEY=VALUE lines
# there produce "Unknown/invalid command" errors).
#
# How it works: systemd's user manager reads every
# ~/.config/environment.d/*.conf file when it starts at login and applies
# the KEY=VALUE lines to the services it launches (D-Bus-activated apps,
# portals, systemd user units). Whether the SWAY PROCESS itself and the
# apps you start from sway keybinds inherit them depends on how you log
# in — don't assume. TEST after login, from a foot terminal:
#     echo $MOZ_ENABLE_WAYLAND        # should print 1
# If it's empty, put the same lines (as `export KEY=VALUE`) in
# ~/.profile (TTY / greetd) or launch sway through a small wrapper.
#
# IMPORTANT: changes here only take effect on your NEXT LOGIN — a sway
# reload ($mod+Shift+c) does nothing for this file.
#
# Format: plain KEY=VALUE per line, no quoting, no shell logic.
# Read `man 5 environment.d` for the full reference.
#
# Deliberately NOT set here (they leak into every other session on this
# account, or break apps):
#   XDG_CURRENT_DESKTOP  -> passed by value in 30-autostart.conf instead
#   XDG_SESSION_TYPE     -> set by logind / the display manager
#   QT_QPA_PLATFORM=wayland, SDL_VIDEODRIVER, CLUTTER_BACKEND -> force
#     Wayland-only and break Qt/SDL apps without a Wayland backend; Qt
#     and SDL already pick Wayland on their own.
#   GTK_THEME            -> clashes with libadwaita/GTK4 and ignores the
#     Nord/Catppuccin choice. For dark GTK apps run once:
#       gsettings set org.gnome.desktop.interface color-scheme prefer-dark

# --- Toolkit backends: Wayland-native where it is safe ---
MOZ_ENABLE_WAYLAND=1
# Qt: prefer Wayland but fall back to X11 instead of failing outright.
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
_JAVA_AWT_WM_NONREPARENTING=1

# --- Cursor theme (adjust to whatever theme you actually have installed) ---
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24

# --- Silence GTK's AT-SPI accessibility-bus warning ---
# Without a full desktop environment running an accessibility bus
# launcher, GTK apps print "the name org.a11y.Bus was not provided by
# any .service file" on every start. Harmless, just noisy. Remove this
# line (and install at-spi2-core) if you ever need a screen reader.
NO_AT_BRIDGE=1

# --- NVIDIA users only: uncomment if you hit rendering issues ---
#WLR_NO_HARDWARE_CURSORS=1
#WLR_DRM_NO_ATOMIC=1
