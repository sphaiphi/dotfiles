# ~/.config/sway/config.d/10-appearance.conf
#
# Look and feel only. Every setting here is applied once at parse/reload
# time — nothing polls, nothing redraws on a timer.
#
# Requires: a font with reasonable glyph coverage (default below assumes
# a Nerd Font is NOT installed — swap for one if you want bar/mode icons).

### Font
font pango:sans-serif 10

### Borders & titlebars
# Thin borders, no titlebar by default: less chrome, marginally less
# compositing work, and matches a tiling-first workflow. Toggle a
# titlebar per-window on demand with $mod+t if you ever want one.
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders --i3 smart
titlebar_padding 4 2

# (Bound here, next to the border settings it affects, on purpose.)
bindsym $mod+t border toggle

### Gaps
# Small gaps look clean without wasting screen space; smart_gaps removes
# them entirely when only one window is visible, so single-window
# workflows get full-bleed by default.
gaps inner 6
gaps outer 0
smart_gaps on
# Not also setting smart_borders here: it overlaps with
# hide_edge_borders --i3 smart above and the two can conflict
# (swaywm/sway#4698) — hide_edge_borders already covers this and
# additionally hides the titlebar on a lone tabbed/stacked child.

### Focus behavior
focus_follows_mouse no
focus_wrapping workspace
mouse_warping output

### Window colors — from the active theme
# Every variable below comes from themes/<name>.conf (included by
# 00-variables.conf); nothing here is a raw hex value. Text colors are
# split ($text_on_focus / $text_on_urgent) because some themes need dark
# text on one accent and light text on the other (Nord does; Catppuccin
# uses dark text on both).
#                                    border       backgr.       text            indicator    child_border
client.focused                      $focus       $focus        $text_on_focus  $focus       $frost_deep
client.focused_inactive             $inactive    $bg_selection $fg             $inactive    $inactive
client.unfocused                    $inactive    $bg           $fg             $inactive    $inactive
client.urgent                       $urgent      $urgent       $text_on_urgent $urgent      $urgent
client.placeholder                  $inactive    $bg           $fg             $inactive    $inactive
client.background                   $bg

### Layout defaults
# Both are sway's defaults; kept explicit so they're easy to change
# (e.g. `workspace_layout tabbed`).
workspace_layout default
default_orientation auto
