# ~/.config/sway/config.d/00-variables.conf
#
# Central variable definitions. Nothing here has a runtime cost — it's
# all substituted at config-parse time. Change a value once here
# instead of hunting through every later file.
#
# Requires: foot (terminal), wofi (launcher), swaylock (screen lock)

### Active theme
# Relative include paths in sway are resolved against the TOP-LEVEL
# config file's directory (~/.config/sway/), not the file containing
# the `include` line — so this is written as `themes/nord.conf`, not
# `../themes/nord.conf`, even though this file itself lives one level
# down in config.d/. Getting that wrong silently breaks every color in
# this config. To switch themes: copy themes/nord.conf to
# themes/<name>.conf with the same variable names, point the line
# below at it, then reload ($mod+Shift+c).
include ../themes/nord.conf

### Mod key
# Logo/Super key. Use Mod1 for Alt if you prefer.
set $mod Mod4

### Core applications
set $term foot
set $menu wofi --show drun --allow-images
set $lock swaylock -f -c $lock_bg
set $file_manager foot -e lf

### Directional keys (kept as variables for easy vim <-> arrow swap)
set $left  Left
set $down  Down
set $up    Up
set $right Right

### Workspace names (plain numbers by default — no icon font dependency)
set $ws1  "1"
set $ws2  "2"
set $ws3  "3"
set $ws4  "4"
set $ws5  "5"
set $ws6  "6"
set $ws7  "7"
set $ws8  "8"
set $ws9  "9"
set $ws10 "10"
