# ~/.config/sway/config.d/50-modes.conf
#
# Named modes: temporary keybinding tables entered via `mode "name"`
# (bound in 40-bindings-core.conf) and exited with Escape/Return. No
# background cost — a mode is just a lookup table swap.
#
# Requires: grim, slurp, wl-clipboard (wl-copy), jq
#
# Screenshots save to ~/Pictures/Screenshots — create that directory
# once (`mkdir -p ~/Pictures/Screenshots`); grim won't create it for you.

### Resize mode
mode "resize" {
    bindsym $left  resize shrink width  10px
    bindsym $down  resize grow   height 10px
    bindsym $up    resize shrink height 10px
    bindsym $right resize grow   width  10px

    # Same, but finer control with arrow keys' shifted counterparts.
    bindsym Shift+$left  resize shrink width  2px
    bindsym Shift+$down  resize grow   height 2px
    bindsym Shift+$up    resize shrink height 2px
    bindsym Shift+$right resize grow   width  2px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}

### Screenshot mode
# Entered with Print (bound in 40-bindings-core.conf).
#   Print again  -> full screen, all outputs
#   s            -> select a region
#   w            -> current (focused) window
#   Shift+<key>  -> same, but copy to clipboard instead of saving to disk
mode "screenshot" {
    bindsym Print exec grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png, \
        mode "default"

    bindsym s exec grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png, \
        mode "default"

    # NB: no comma may appear outside a quoted string here — sway splits
    # bind commands on , and ; before the shell ever sees them. So jq emits
    # "x y w h" (spaces only) and sed turns it into grim's "x,y wxh"; the
    # sed comma sits inside the outer "$(...)" string, which sway skips.
    bindsym w exec grim -g "$(swaymsg -t get_tree | \
        jq -j '.. | select(.type?=="con" and .focused?) | .rect | "\(.x) \(.y) \(.width) \(.height)"' | \
        sed -E 's/ /,/;s/ /x/2')" \
        ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png, \
        mode "default"

    bindsym Shift+Print exec grim - | wl-copy, mode "default"
    bindsym Shift+s     exec grim -g "$(slurp)" - | wl-copy, mode "default"

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
