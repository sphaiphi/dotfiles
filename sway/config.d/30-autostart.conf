# ~/.config/sway/config.d/30-autostart.conf
#
# Autostart. Kept deliberately short: five long-running processes, each
# event-driven (idle on timers/DBus, notifications on DBus, polkit on
# DBus, text and image clipboard watchers on the Wayland selection
# event) — nothing here busy-polls.
#
# Requires: mako (Fedora `dnf install mako`) or mako-notifier
#           (Ubuntu/Debian `apt install mako-notifier` — same `mako`
#           binary once installed, Debian just packages it under a
#           different name), swayidle, swaylock, polkit-gnome (Fedora)
#           or policykit-1-gnome (Ubuntu/Debian — same binary,
#           different install path, handled by the fallback below),
#           wl-clipboard (wl-paste), cliphist (natively packaged in
#           Fedora and Ubuntu 24.04+/26.04 LTS universe repos),
#           dbus-update-activation-environment (part of dbus-user-session
#           / dbus-daemon on both distros — see the first exec below)

### D-Bus activation environment
# Must run FIRST, before anything that talks to D-Bus service
# activation (portals, notifications). Setting XDG_CURRENT_DESKTOP /
# WAYLAND_DISPLAY via environment.d makes them visible to processes
# YOU launch, but D-Bus's own service-activation environment is
# separate and doesn't pick those up automatically — without this
# line, any app requesting org.freedesktop.portal.Desktop (screen
# share, GTK file pickers, dark-mode detection) hangs for the full
# activation timeout and then fails. One-shot, not a daemon.
# XDG_CURRENT_DESKTOP is given as a VALUE (not just a name): sway does not
# set it itself, and portals pick their backend from it. Passing it here
# means portals work even if environment.d never reached the session.
exec dbus-update-activation-environment --systemd \
    WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway SWAYSOCK

### Notification daemon
# `exec`, not `exec_always`: mako is a long-running daemon with no
# self-replacement logic, so `exec_always` would try to spawn a second
# instance on every `$mod+Shift+c` reload.
exec mako

### Polkit authentication agent
# Needed for GUI password prompts (package installs, mounting drives,
# etc). The binary lives at a different path per distro — Fedora's
# `polkit-gnome` package uses /usr/libexec/, Ubuntu/Debian's
# `policykit-1-gnome` package uses /usr/lib/policykit-1-gnome/. Try
# both; first one found wins. Same `exec`-not-`exec_always` reasoning
# as mako above.
exec sh -c '\
    exec /usr/libexec/polkit-gnome-authentication-agent-1 2>/dev/null || \
    exec /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1'

### Idle management: dim, then lock, then sleep — in that order.
# swayidle only wakes on its own timers, no polling of anything else.
# Uses $lock (defined in 00-variables.conf) so the lock command only
# needs to be changed in one place.
exec swayidle -w \
    timeout 300 '$lock' \
    timeout 600 'swaymsg "output * dpms off"' \
        resume 'swaymsg "output * dpms on"' \
    before-sleep '$lock'

### Clipboard history
# Records everything you copy into cliphist's on-disk history so it can
# be browsed and re-copied later with $mod+c (bound in
# 40-bindings-core.conf). Two watchers, as cliphist's README
# recommends: one for text, one for images, so images are stored
# reliably. Each idles until Wayland announces a new selection.
#
# This is history only. It does NOT keep the live clipboard alive after
# the source app exits (on Wayland the clipboard dies with its owner);
# that would need a separate tool such as wl-clip-persist.
exec wl-paste --type text  --watch cliphist store
exec wl-paste --type image --watch cliphist store

### Optional, commented out by default (uncomment what you actually use):
# GTK settings daemon for icon/cursor theme sync across GTK apps.
#exec_always gnome-settings-daemon --replace
# Bluetooth applet.
#exec_always blueman-applet
