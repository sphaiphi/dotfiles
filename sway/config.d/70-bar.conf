# ~/.config/sway/config.d/70-bar.conf
#
# Status bar. Waybar is the primary option (modules, tray, better
# per-workspace styling than the built-in bar) — if you'd rather have
# zero extra bar dependency, comment this block out and uncomment the
# native fallback below instead.
#
# Requires: waybar (primary option only)

bar {
    swaybar_command waybar
}

