# ~/.config/sway/config.d/60-window-rules.conf
#
# Per-window rules. Matched once when a window maps — no ongoing cost.
# Extend the app_id/title lists here as you hit apps that misbehave
# (open as huge tiled windows when they should float, etc).
#
# Find an app's app_id/class with: swaymsg -t get_tree | grep app_id
# (window_role / window_type below only exist for XWayland windows.)

### Float known dialogs, pickers, and utility windows
for_window [app_id="^(pavucontrol|blueman-manager|nm-connection-editor)$"] floating enable
for_window [window_role="pop-up"]     floating enable
for_window [window_role="bubble"]     floating enable
for_window [window_role="dialog"]     floating enable
for_window [window_type="dialog"]     floating enable
for_window [window_type="menu"]       floating enable
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable, \
    move position 98% 98%

### File-chooser dialogs
# The portal's GTK chooser has its own app_id. The title rule is a
# fallback and matches EXACT titles only — an open-ended pattern such as
# "^Open.*" would float any window (e.g. a browser) whose page title
# merely starts with that word.
for_window [app_id="^xdg-desktop-portal-gtk$"] floating enable
for_window [title="^(Open Files?|Save File|Save As|Select (a )?(File|Folder))$"] floating enable

### Shortcuts inhibitor
# By default, fullscreened Chromium/Electron/browser windows can grab
# and swallow ALL keyboard shortcuts (including $mod combos). This sets
# the seat-wide default to OFF, so Sway's own bindings keep working
# inside those apps. There's no vanilla-Sway runtime toggle for this —
# if a specific app genuinely needs to receive raw shortcuts (e.g. a
# remote-desktop tab), add a per-app override instead:
#for_window [app_id="remmina"] shortcuts_inhibitor enable
seat seat0 shortcuts_inhibitor disable

### Workspace assignment template (opt-in — uncomment and edit)
# Handy once you have a stable set of "this app always lives on
# workspace N" rules; left empty by default so nothing surprises you
# on a fresh install.
#assign [app_id="firefox"]    workspace number $ws1
#assign [app_id="foot"]       workspace number $ws2
#assign [app_id="Slack"]      workspace number $ws9
