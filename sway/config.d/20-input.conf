# ~/.config/sway/config.d/20-input.conf
#
# Input device configuration. Matched by type (`type:keyboard`,
# `type:touchpad`) so this works unchanged across machines — no need to
# hardcode a device identifier unless you have a specific override.
#
# Run `swaymsg -t get_inputs` to see identifiers if you need a
# per-device rule instead.

### Keyboard
# Two layouts: US (default, index 0) and Thai (index 1). Switch
# between them with Ctrl+Shift. (Win+Space was the other common
# option, but $mod+space is already bound to focus mode_toggle in
# 40-bindings-core.conf — Ctrl+Shift avoids that collision entirely
# and doesn't use $mod at all, so it can't collide with anything
# added there later either.)
# caps:escape is combined with the layout switch via a comma-separated
# xkb_options list (grp: options only take effect together with 2+
# layouts in xkb_layout).
input "type:keyboard" {
    xkb_layout us,th
    xkb_options caps:escape,grp:ctrl_shift_toggle
    repeat_delay 300
    repeat_rate 40
}

### Current keyboard layout indicator
# With two layouts configured, it's worth seeing which one is active.
# Waybar shows this automatically via the "sway/language" module if
# you add it to modules-right in waybar/config.jsonc — no extra
# package needed, sway already tracks and exposes this state.

### Touchpad
# Tap-to-click and natural scrolling are the two settings almost
# everyone wants on; disable-while-typing avoids accidental clicks.
input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
    scroll_method two_finger
}

### Pointer (mouse)
input "type:pointer" {
    accel_profile flat
    pointer_accel 0
}

### Touchpad gestures
# No-ops on hardware without gesture support — safe to leave in
# unconditionally.
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:left  workspace next
bindgesture pinch:inward  scratchpad show
