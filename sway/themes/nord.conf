# ~/.config/sway/themes/nord.conf
#
# Nord theme (https://www.nordtheme.com). This file defines ONLY colors
# — no bindings, no app choices — so it's swappable without touching
# anything else. To add another theme later: copy this file to
# themes/<name>.conf, change the values (keep every variable name
# identical), then point the `include` line in
# config.d/00-variables.conf at the new file and reload
# ($mod+Shift+c). Every other config.d/*.conf file references these
# semantic names ($bg, $focus, etc.), never raw hex, so that one
# include line is the only edit a theme switch requires.
#
# All four Nord groups used with a distinct purpose, not just "the
# blue one and the dark one":
#
#   Polar Night (backgrounds/structure)      Snow Storm (text)
#   nord0  #2E3440  base background          nord4  #D8DEE9  default text
#   nord1  #3B4252  elevated surface (bar)    nord5  #E5E9F0  (reserved — dimmer
#   nord2  #434C5E  selection / hover                          text tier if needed)
#   nord3  #4C566A  muted borders/inactive    nord6  #ECEFF4  emphasized text,
#                                                              text-on-urgent
#   Frost (accents)                          Aurora (semantic states)
#   nord7  #8FBCBB  (reserved — alt accent)   nord11 #BF616A  urgent / critical
#   nord8  #88C0D0  primary accent (focus)    nord12 #D08770  secondary warning
#   nord9  #81A1C1  secondary accent          nord13 #EBCB8B  warning (battery)
#   nord10 #5E81AC  deep accent (child border) nord14 #A3BE8C  success (charging)
#                                              nord15 #B48EAD  special accent
#                                                              (scratchpad)
#
# nord5 and nord7 have no distinct job at WM-border scale; named here so
# they're accounted for rather than silently dropped, and free to reach
# for later (e.g. nord7 as an alternate scratchpad accent).
set $bg             #2E3440
set $bg_alt         #3B4252
set $bg_selection   #434C5E
set $inactive       #4C566A
set $fg             #D8DEE9
set $fg_bright      #ECEFF4
set $focus          #88C0D0
set $frost_blue     #81A1C1
set $frost_deep     #5E81AC
set $urgent         #BF616A
set $orange         #D08770
set $warning        #EBCB8B
set $success        #A3BE8C
set $purple         #B48EAD
set $text_on_focus  #2E3440
set $text_on_urgent #ECEFF4

# swaylock's -c flag wants bare hex, no leading #, so it gets its own
# variable rather than reusing $bg directly.
set $lock_bg 2E3440
