# ~/.config/sway/themes/catppuccin.conf
#
# Catppuccin Mocha (https://catppuccin.com) — the darkest, most common
# flavor for WM/terminal theming. (Latte/Frappé/Macchiato are the
# other three; add them the same way as any other theme — copy this
# file to themes/catppuccin-<flavor>.conf with the official hex values
# for that flavor, keep every variable name identical.)
#
# Same variable NAMES as themes/nord.conf — only the values differ —
# so switching is still just the one `include` line in
# config.d/00-variables.conf.
#
# Design note, worth calling out rather than silently copying Nord's
# structure: Nord split $text_on_focus (dark) from $text_on_urgent
# (light) because Nord's Frost accents are light and its Aurora
# accents are comparatively darker/more saturated. Catppuccin's entire
# accent set (Rosewater through Lavender) is uniformly light/pastel BY
# DESIGN — they're meant as foreground accents against a dark base,
# not as medium-tone fills. So here, BOTH focus (Blue) and urgent
# (Red) are light enough that dark text reads better on both — no
# split needed for this theme specifically. Re-check this per theme;
# don't assume Nord's split generalizes.
#
# Official Catppuccin Mocha palette reference:
#   Base #1e1e2e · Mantle #181825 · Crust #11111b
#   Surface0 #313244 · Surface1 #45475a · Surface2 #585b70
#   Overlay0 #6c7086 · Overlay1 #7f849c · Overlay2 #9399b2
#   Subtext0 #a6adc8 · Subtext1 #bac2de · Text #cdd6f4
#   Rosewater #f5e0dc · Flamingo #f2cdcd · Pink #f5c2e7 · Mauve #cba6f7
#   Red #f38ba8 · Maroon #eba0ac · Peach #fab387 · Yellow #f9e2af
#   Green #a6e3a1 · Teal #94e2d5 · Sky #89dceb · Sapphire #74c7ec
#   Blue #89b4fa · Lavender #b4befe
set $bg             #1e1e2e
set $bg_alt         #313244
set $bg_selection   #45475a
set $inactive       #585b70
set $fg             #cdd6f4
set $fg_bright      #f5e0dc
set $focus          #89b4fa
set $frost_blue     #74c7ec
set $frost_deep     #b4befe
set $urgent         #f38ba8
set $orange         #fab387
set $warning        #f9e2af
set $success        #a6e3a1
set $purple         #cba6f7
set $text_on_focus  #1e1e2e
set $text_on_urgent #1e1e2e

# swaylock's -c flag wants bare hex, no leading #.
set $lock_bg 1e1e2e
